name: CICD Staging

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write # needed for gitleaks to annotate PRs

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  build-scan-push:
    name: Build, Scan and Push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [gitleaks, sonarqube]

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPONAME }}:${{ github.ref_name }}
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: '${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPONAME }}:${{ github.ref_name }}'
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.txt

      - name: Push Docker image
        if: success() && github.event_name == 'push'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPONAME }}:${{ github.ref_name }}

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    if: github.event_name == 'push'

    steps:
      - name: SSH rollout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: rollout ${{ vars.DOCKERHUB_USERNAME }} ${{ secrets.DOCKERHUB_TOKEN }} ${{ vars.SERVICE_NAME }} ${{ vars.ENV_KEY }} ${{ github.ref_name }}

  verify:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - name: Health check
        run: |
          for i in $(seq 1 6); do
            echo "Attempt $i/6..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 --connect-timeout 3 "${{ vars.HEALTH_CHECK_URL }}")
            echo "HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check PASSED on attempt $i"
              exit 0
            fi
            echo "Not ready — waiting 10s before next attempt"
            sleep 10
          done
          echo "Health check FAILED after 6 attempts"
          exit 1
