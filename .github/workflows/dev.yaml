name: CI Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  sonar:
    uses: hoangnam-esign/devops-templates/.github/workflows/sonar.yml@main
    secrets: inherit
    with:
      language: nodejs
      node-version: "20"
